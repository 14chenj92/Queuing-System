  <script src="function.js"></script>
  <script>
    let signedInEmails = [];

    async function populateEmailSuggestions() {
      try {
        const res = await fetch('/users/signed-in');
        const users = await res.json();
        signedInEmails = users.map(u => u.email.toLowerCase());
      } catch (e) {}
    }

    const emailInputIds = [
      'bookingUsername1','bookingUsername2','bookingUsername3','bookingUsername4',
      'unbookingUsername1','unbookingUsername2','unbookingUsername3','unbookingUsername4'
    ];

    function setupSuggest(inputId) {
      const input = document.getElementById(inputId);
      const list = document.getElementById('sug-' + inputId);

      input.addEventListener('input', () => {
        const val = input.value.toLowerCase();
        list.innerHTML = '';
        if (!val) { list.style.display = 'none'; return; }
        const matches = signedInEmails.filter(e => e.startsWith(val));
        if (!matches.length) { list.style.display = 'none'; return; }
        matches.forEach(email => {
          const li = document.createElement('li');
          li.textContent = email;
          li.addEventListener('mousedown', () => {
            input.value = email;
            list.style.display = 'none';
          });
          list.appendChild(li);
        });
        list.style.display = 'block';
      });

      input.addEventListener('blur', () => {
        setTimeout(() => { list.style.display = 'none'; }, 150);
      });
    }

    emailInputIds.forEach(setupSuggest);
    populateEmailSuggestions();
    setInterval(populateEmailSuggestions, 5000);
  </script>
